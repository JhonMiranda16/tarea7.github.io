<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números del 1 al 100</title>
</head>
<body>
    <script>
        for (var x = 1; x <= 100; x++) {
            document.write(x + "<br>");
        }
    </script>
</body>
</html>
